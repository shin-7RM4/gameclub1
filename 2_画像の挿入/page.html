    <body>
        <h1>対応ハード</h1>
        <p>このゲームは、PC、PlayStation 4、Xbox One、Nintendo Switchでプレイすることができます。<br>ハードの特徴比較は以下の表です。</p>
        <table border="1">
            <tr>
                <th>ハード</th>
                <th>特徴</th>
            </tr>
            <tr>
                <td>PC</td>
                <td>MODを入れることで、ゲームのクオリティをさらに高めることができます。</td>
            </tr>
            <tr>
                <td>PlayStation 4</td>
                <td>PC版よりも制限されますが、ハイスペックな家庭用ゲーム機でプレイできます。</td>
            </tr>
            <tr>
                <td>Xbox One</td>
                <td>PlayStation 4と同様に、家庭用ゲーム機でプレイできる点が魅力です。</td>
            </tr>
            <tr>
                <td>Nintendo Switch</td>
                <td>携帯モードで気軽にプレイできる点が魅力です。</td>
            </tr>
    </body>
